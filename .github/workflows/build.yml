name: Build Standalone RVC EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PyInstaller ile EXE Yap
        run: |
          pyinstaller --noconfirm --onefile --windowed --name="RVC_VoiceChanger" main.py

      - name: EXE Dosyasını Yayınla (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: RVC_VoiceChanger
          path: dist/RVC_VoiceChanger.exe
          
