name: Build GPU-Enabled RVC EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          # NOT: pip 24.1+ artık PEP 440'a uymayan sürüm belirteçlerini
          # (ör. omegaconf==2.0.6'nın "PyYAML>=5.1.*" metadata'sı) sert
          # hata olarak reddediyor. rvc-python -> fairseq zinciri bu
          # omegaconf sürümünü sabit istediği için, paketi değil,
          # pip'i eski (uyumlu) sürüme sabitliyoruz.
          python -m pip install "pip<24.1"
          pip install -r requirements.txt

      - name: rvc_python İçe Aktarma Kontrolü
        # NOT: Kurulum "başarılı" görünse bile fairseq zincirinde bir
        # şey eksik/bozuksa import burada hemen patlar ve build boşuna
        # ilerlemez; hata mesajı EXE içinde saklı kalmaz.
        run: python -c "from rvc_python.infer import RVCInference; print('rvc_python OK')"

      - name: Standalone EXE Derle
        # NOT: windows-latest runner'da run: adımları varsayılan olarak
        # PowerShell ile çalışır. "^" satır devamı karakteri cmd.exe'ye
        # özgüdür; PowerShell'de "--" ile başlayan bir satır operatör
        # sanılıp hataya yol açar. Bu yüzden komut, kabuk-bağımsız
        # olacak şekilde tek satırda yazıldı.
        # NOT: --runtime-hook, main.py çalışmaya başlamadan önce
        # pyi_rth_site_builtins.py'yi çalıştırır; bu, frozen ortamda
        # eksik olan help/copyright/credits/license/exit/quit
        # builtin'lerini geri ekler (bkz. dosyanın içindeki açıklama).
        run: pyinstaller --noconfirm --onedir --windowed --name="RVC_VoiceChanger" --runtime-hook=pyi_rth_site_builtins.py --collect-all torch --collect-all torchaudio --collect-all rvc_python --collect-all fairseq --collect-all hydra --collect-all hydra_core --collect-all omegaconf --collect-all sounddevice --collect-all soundfile main.py

      - name: EXE Klasörünü Yayınla (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: RVC_VoiceChanger_GPU
          path: dist/RVC_VoiceChanger/
