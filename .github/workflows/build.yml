name: Build GPU-Enabled RVC EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: CUDA Destekli Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu118
          pip install sounddevice numpy requests pyinstaller

      - name: Standalone EXE Derle
        run: |
          pyinstaller --noconfirm --onefile --windowed --name="RVC_VoiceChanger" main.py

      - name: EXE Dosyasını Yayınla (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: RVC_VoiceChanger_GPU
          path: dist/RVC_VoiceChanger.exe
          
